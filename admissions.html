<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admissions — Pioneer Technical Institute</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="site-header" id="site-header"></header>

<section class="hero-page">
  <div class="wrap">
    <span class="eyebrow">Admissions</span>
    <h1>Apply anytime — training runs year round</h1>
    <p id="adm-intro">Loading…</p>
  </div>
</section>

<section id="apply">
  <div class="wrap grid grid-2">
    <div>
      <h2>How to apply</h2>
      <div id="how-to-apply"></div>
    </div>
    <div>
      <h2>Government bursary</h2>
      <p id="adm-bursary"></p>
      <div class="card" style="margin-top:24px;">
        <div class="card-body">
          <h3>Talk to admissions</h3>
          <p id="adm-contact-line" style="margin-bottom:16px;"></p>
          <a href="contact.html" class="btn btn-primary">Contact the Institute</a>
        </div>
      </div>
    </div>
  </div>
</section>

<footer class="site-footer" id="site-footer"></footer>

<script src="assets/js/content.js"></script>
<script src="assets/js/main.js"></script>
<script>
document.addEventListener("DOMContentLoaded", async () => {
  const [adm, site] = await Promise.all([
    fetchJSON("content/pages/admissions.json"),
    fetchJSON("content/site.json"),
  ]);

  if (adm) {
    document.getElementById("adm-intro").textContent = adm.intro || "";
    document.getElementById("adm-bursary").textContent = adm.bursary || "";
    const list = document.getElementById("how-to-apply");
    if (adm.how_to_apply?.length) {
      list.innerHTML = adm.how_to_apply.map((step, i) => `
        <div class="feature-row">
          <span class="feature-num">0${i + 1}</span>
          <p style="margin:0;">${esc(step)}</p>
        </div>`).join("");
    } else {
      emptyState(list, "Application steps will appear here once added.");
    }
  }

  if (site) {
    const director = site.contacts?.find(c => c.role === "Director");
    document.getElementById("adm-contact-line").textContent =
      `Call the Director at ${director?.phone || site.phone} or email ${site.email}.`;
  }
});
</script>
</body>
</html>
