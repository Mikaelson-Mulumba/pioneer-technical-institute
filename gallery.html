<script>
document.addEventListener("DOMContentLoaded", async () => {
  const data = await fetchJSON("content/gallery.json");
  const grid = document.getElementById("gallery-grid");
  const images = data?.images || [];
  if (images.length) {
    grid.innerHTML = images.map(g => `<img src="${esc(g.image)}" alt="${esc(g.caption || '')}" loading="lazy">`).join("");
  } else {
    emptyState(grid, "Photos will appear here once added from the control panel.");
  }
});

   (function () {
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    const closeBtn = document.getElementById('lightboxClose');

    // Event delegation on the whole document: works for any number of
    // .gallery-grid sections added now or later, no per-section wiring needed.
    document.addEventListener('click', (e) => {
      if (e.target.matches('.gallery-grid img')) {
        lightboxImg.src = e.target.src;
        lightboxImg.alt = e.target.alt;
        lightbox.classList.add('active');
      }
    });

    function closeLightbox() {
      lightbox.classList.remove('active');
    }

    closeBtn.addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) closeLightbox();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeLightbox();
    });
  })();
</script>
