<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Page — Pioneer Technical Institute</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="site-header" id="site-header"></header>

<section class="hero-page" id="page-hero">
  <div class="wrap">
    <span class="eyebrow" id="p-eyebrow">Page</span>
    <h1 id="p-heading">Loading…</h1>
    <p id="p-sub"></p>
  </div>
</section>

<section>
  <div class="wrap">
    <div id="p-sections"></div>
  </div>
</section>

<section class="cta-band">
  <div class="wrap">
    <h2>Ready to get started?</h2>
    <p>Admission runs all year round. Start your application today.</p>
    <a href="apply.html" class="btn btn-light" style="margin-top:18px;">Apply Now</a>
  </div>
</section>

<footer class="site-footer" id="site-footer"></footer>

<script src="assets/js/content.js"></script>
<script src="assets/js/main.js"></script>
<script>
document.addEventListener("DOMContentLoaded", async () => {
  const params = new URLSearchParams(location.search);
  const slug = params.get("slug") || "__SLUG__";
  const p = await fetchJSON(`content/pages/simple/${slug}.json`);

  if (!p) {
    document.getElementById("p-heading").textContent = "Page not found";
    return;
  }

  document.title = p.seo_title || `${p.heading} — Pioneer Technical Institute`;
  let metaDesc = document.querySelector('meta[name="description"]');
  if (!metaDesc) { metaDesc = document.createElement("meta"); metaDesc.name = "description"; document.head.appendChild(metaDesc); }
  metaDesc.content = p.seo_description || p.sub || "";
  let metaKw = document.querySelector('meta[name="keywords"]');
  if (!metaKw) { metaKw = document.createElement("meta"); metaKw.name = "keywords"; document.head.appendChild(metaKw); }
  metaKw.content = p.seo_keywords || `${p.heading}, Pioneer Technical Institute, Iganga Uganda`;

  document.getElementById("p-eyebrow").textContent = p.eyebrow || "";
  document.getElementById("p-heading").textContent = p.heading || "";
  document.getElementById("p-sub").textContent = p.sub || "";

  if (p.image) {
    document.getElementById("page-hero").style.backgroundImage =
      `linear-gradient(rgba(27,54,93,0.75), rgba(27,54,93,0.85)), url('${p.image}')`;
    document.getElementById("page-hero").style.backgroundSize = "cover";
    document.getElementById("page-hero").style.backgroundPosition = "center";
  }

  const box = document.getElementById("p-sections");
  if (p.sections?.length) {
    box.innerHTML = p.sections.map((s, i) => `
      <div class="section-head" style="margin-top:${i === 0 ? 0 : 44}px;">
        <span class="eyebrow">${String(i + 1).padStart(2, "0")}</span>
        <h2>${esc(s.heading)}</h2>
      </div>
      <div style="max-width:820px;">
        ${(s.body || "").split(/\n{2,}/).map(para => `<p>${esc(para)}</p>`).join("")}
      </div>
      ${s.list?.length ? `<ul class="req-list" style="max-width:820px; margin-top:16px;">${s.list.map(li => `<li>${esc(li)}</li>`).join("")}</ul>` : ""}
    `).join("");
  } else {
    emptyState(box, "Content for this page will appear here once added.");
  }
});
</script>
</body>
</html>
