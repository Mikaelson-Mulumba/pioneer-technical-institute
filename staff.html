<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Staff — Pioneer Technical Institute</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="site-header" id="site-header"></header>

<section class="hero-page">
  <div class="wrap">
    <span class="eyebrow">Our Staff</span>
    <h1>Expert. Experienced. Skilled.</h1>
    <p>Our instructors are among the best in the region — come meet us at the campus.</p>
  </div>
</section>

<section>
  <div class="wrap">
    <div class="grid grid-4" id="staff-list"></div>
  </div>
</section>

<footer class="site-footer" id="site-footer"></footer>

<script src="assets/js/content.js"></script>
<script src="assets/js/main.js"></script>
<script>
document.addEventListener("DOMContentLoaded", async () => {
  const staff = await fetchJSON("content/staff.json");
  const grid = document.getElementById("staff-list");
  if (staff?.members?.length) {
    grid.innerHTML = staff.members.map(m => `
      <div class="card staff-card">
        ${m.photo ? `<img src="${esc(m.photo)}" alt="${esc(m.name)}">` : `<div style="aspect-ratio:1/1;background:var(--cream-dim);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);color:var(--steel-light);">No photo</div>`}
        <div class="card-body">
          <h3>${esc(m.name)}</h3>
          <span class="role">${esc(m.title)}</span>
          ${m.phone ? `<div class="phone">${esc(m.phone)}</div>` : ""}
        </div>
      </div>`).join("");
  } else {
    emptyState(grid, "Staff profiles will appear here once added from the control panel.");
  }
});
</script>
</body>
</html>
