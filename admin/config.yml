backend:
  name: git-gateway
  branch: main

# Where uploaded photos are stored in the repo, and the public URL
# path the site's HTML uses to display them.
media_folder: "assets/uploads"
public_folder: "/assets/uploads"

site_url: https://pioneertechnicalinstitute.ac.ug
display_url: https://pioneertechnicalinstitute.ac.ug

collections:

  - name: "site_settings"
    label: "Site Settings"
    files:
      - file: "content/site.json"
        label: "Contact & General Info"
        name: "site"
        fields:
          - { label: "Institute Name", name: "name", widget: "string" }
          - { label: "Motto", name: "motto", widget: "string" }
          - { label: "Vision", name: "vision", widget: "text" }
          - { label: "Mission", name: "mission", widget: "text" }
          - { label: "Address", name: "address", widget: "text" }
          - { label: "Operating Hours", name: "hours", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Main Phone", name: "phone", widget: "string" }
          - label: "Contact Numbers"
            name: "contacts"
            widget: "list"
            fields:
              - { label: "Role", name: "role", widget: "string" }
              - { label: "Phone", name: "phone", widget: "string" }
          - { label: "Accreditation Text", name: "accreditation", widget: "text" }
          - label: "Homepage Stats"
            name: "stats"
            widget: "list"
            fields:
              - { label: "Value", name: "value", widget: "string" }
              - { label: "Label", name: "label", widget: "string" }

  - name: "staff"
    label: "Staff"
    files:
      - file: "content/staff.json"
        label: "Staff Directory"
        name: "staff"
        fields:
          - label: "Members"
            name: "members"
            widget: "list"
            summary: "{{name}} — {{title}}"
            fields:
              - { label: "Full Name", name: "name", widget: "string" }
              - { label: "Title / Role", name: "title", widget: "string" }
              - { label: "Department", name: "department", widget: "string", required: false }
              - { label: "Phone", name: "phone", widget: "string", required: false }
              - { label: "Photo", name: "photo", widget: "image", required: false }

  - name: "courses"
    label: "Courses"
    files:
      - file: "content/courses.json"
        label: "Course Catalog"
        name: "courses"
        fields:
          - label: "Courses"
            name: "courses"
            widget: "list"
            summary: "{{name}} — {{level}} ({{category}})"
            fields:
              - { label: "URL Slug (unique, no spaces — used in the page link)", name: "slug", widget: "string" }
              - { label: "Course Name", name: "name", widget: "string" }
              - label: "Category"
                name: "category"
                widget: "select"
                options:
                  - "Engineering & Technical Trades"
                  - "Business"
                  - "Hospitality & Hotel Management"
                  - "Technology & ICT"
                  - "Agriculture"
                  - "Nursery Teaching & Early Childhood Education"
              - { label: "Level", name: "level", widget: "string", hint: "e.g. Junior Certificate, National Certificate, Short Course" }
              - { label: "Duration", name: "duration", widget: "string", hint: "e.g. 2 years, 3 months, 6 weeks" }
              - { label: "Credential Awarded", name: "credential", widget: "string", required: false }
              - { label: "Delivery Mode", name: "delivery", widget: "string", required: false, hint: "e.g. On-Campus, Online, Hybrid" }
              - { label: "Language of Instruction", name: "language", widget: "string", required: false, default: "English" }
              - { label: "Entry Requirement", name: "entry_requirement", widget: "string", required: false, hint: "e.g. P7 for Junior, S4/UCE for National, Open to all for Short courses" }
              - { label: "Pathway / Progression Note", name: "pathway_note", widget: "text", required: false, hint: "Explain how a trainee progresses — e.g. Junior → National → Diploma/Bachelor's, or the First Class fast-track to Bachelor's" }
              - label: "Industries Graduates Work In"
                name: "industries"
                widget: "list"
                required: false
                field: { label: "Industry", name: "industry", widget: "string" }
              - { label: "Quick Outcome Line", name: "quick_outcome", widget: "string", required: false, hint: "One sentence: Finish this course and you can work as..." }
              - { label: "Course Photo", name: "image", widget: "image", required: false }
              - { label: "About This Programme", name: "about", widget: "text" }
              - { label: "SEO Page Title", name: "seo_title", widget: "string", required: false, hint: "Shown in Google search results / browser tab" }
              - { label: "SEO Meta Description", name: "seo_description", widget: "text", required: false, hint: "1-2 sentences shown under the title in Google search results" }
              - { label: "SEO Keywords", name: "seo_keywords", widget: "string", required: false, hint: "Comma-separated search terms" }
              - label: "Admission Requirements"
                name: "admission_requirements"
                widget: "list"
                field: { label: "Requirement", name: "requirement", widget: "string" }
              - label: "What You Will Learn"
                name: "what_you_will_learn"
                widget: "list"
                field: { label: "Learning Outcome", name: "outcome", widget: "string" }
              - label: "Career Opportunities"
                name: "career_opportunities"
                widget: "list"
                summary: "{{title}}"
                fields:
                  - { label: "Career/Role Title", name: "title", widget: "string" }
                  - { label: "Main Responsibilities", name: "responsibility", widget: "text" }

  - name: "news"
    label: "News"
    files:
      - file: "content/posts.json"
        label: "News Posts"
        name: "posts"
        fields:
          - label: "Posts"
            name: "posts"
            widget: "list"
            summary: "{{title}} — {{date}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
              - { label: "Cover Image", name: "image", widget: "image", required: false }
              - { label: "Excerpt", name: "excerpt", widget: "text" }
              - { label: "Full Story", name: "body", widget: "markdown", required: false }

  - name: "gallery"
    label: "Gallery"
    files:
      - file: "content/gallery.json"
        label: "Photo Gallery"
        name: "gallery"
        fields:
          - label: "Images"
            name: "images"
            widget: "list"
            summary: "{{caption}}"
            fields:
              - { label: "Photo", name: "image", widget: "image" }
              - { label: "Caption", name: "caption", widget: "string", required: false }

  - name: "pages"
    label: "Pages"
    files:
      - file: "content/pages/home.json"
        label: "Home Page"
        name: "home"
        fields:
          - { label: "Hero Eyebrow", name: "hero_eyebrow", widget: "string" }
          - { label: "Hero Heading", name: "hero_heading", widget: "string" }
          - { label: "Hero Subtext", name: "hero_sub", widget: "text" }

      - file: "content/pages/about.json"
        label: "About / Our Story Page"
        name: "about"
        fields:
          - { label: "Intro", name: "intro", widget: "text" }
          - { label: "Why Pioneer", name: "why", widget: "text" }
          - { label: "Target Group", name: "target_group", widget: "text" }
          - { label: "Core Values", name: "core_values", widget: "list", field: { label: "Value", name: "value", widget: "string" } }
          - { label: "How We Train", name: "training", widget: "text" }
          - { label: "Accreditation", name: "accreditation", widget: "text" }

      - file: "content/pages/admissions.json"
        label: "Admissions Page"
        name: "admissions"
        fields:
          - { label: "Intro", name: "intro", widget: "text" }
          - { label: "Bursary Info", name: "bursary", widget: "text" }
          - { label: "How To Apply Steps", name: "how_to_apply", widget: "list", field: { label: "Step", name: "step", widget: "string" } }

      - file: "content/pages/our-story.json"
        label: "Our Story Page"
        name: "our_story"
        fields: &sections_field
          - label: "Sections"
            name: "sections"
            widget: "list"
            summary: "{{heading}}"
            fields:
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Body", name: "body", widget: "text" }

      - file: "content/pages/governance.json"
        label: "Governance Page"
        name: "governance"
        fields: *sections_field

      - file: "content/pages/collaboration-and-partnership.json"
        label: "Collaboration & Partnership Page"
        name: "collaboration_and_partnership"
        fields: *sections_field

      - file: "content/pages/how-you-will-learn.json"
        label: "How You Will Learn Page"
        name: "how_you_will_learn"
        fields: *sections_field

      - file: "content/pages/students.json"
        label: "Students Page"
        name: "students"
        fields: *sections_field

      - file: "content/pages/students-charter.json"
        label: "Student's Charter Page"
        name: "students_charter"
        fields: *sections_field

      - file: "content/pages/life-at-pti.json"
        label: "Life at PTI Page"
        name: "life_at_pti"
        fields: *sections_field

      - file: "content/pages/about-wil.json"
        label: "About WIL Page"
        name: "about_wil"
        fields: *sections_field

      - file: "content/pages/how-wil-works.json"
        label: "How WIL Works Page"
        name: "how_wil_works"
        fields: *sections_field

      - file: "content/pages/key-steps-in-wil.json"
        label: "Key Steps in WIL Page"
        name: "key_steps_in_wil"
        fields: *sections_field

      - file: "content/pages/get-to-work.json"
        label: "Get to Work Page"
        name: "get_to_work"
        fields: *sections_field

      - file: "content/pages/your-call.json"
        label: "Your Call Page"
        name: "your_call"
        fields: *sections_field
