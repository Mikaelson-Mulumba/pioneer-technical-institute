<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Short Courses & Professional Certificates — Pioneer Technical Institute</title>
<meta name="description" content="Short courses and professional/online certificates at Pioneer Technical Institute, Iganga — open to everyone, no entry requirement.">
<link rel="canonical" href="https://pioneertechnicalinstitute.ac.ug/short-courses.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="site-header" id="site-header"></header>

<section class="hero-page">
  <div class="wrap">
    <span class="eyebrow">Admissions</span>
    <h1>Short Courses & Professional Certificates</h1>
    <p>Open to everyone — no formal entry requirement. From weeks to months, including online certificates via Cisco, IBM, and Coursera.</p>
  </div>
</section>

<section>
  <div class="wrap">
    <input type="text" id="course-search" placeholder="Search by course name…" style="margin-bottom:28px;">
    <div id="course-sections"></div>
  </div>
</section>

<section class="cta-band">
  <div class="wrap">
    <h2>Found your course?</h2>
    <p>Admission runs all year round.</p>
    <a href="apply.html" class="btn btn-light" style="margin-top:18px;">Apply Now</a>
  </div>
</section>

<footer class="site-footer" id="site-footer"></footer>

<script src="assets/js/content.js"></script>
<script src="assets/js/main.js"></script>
<script>
document.addEventListener("DOMContentLoaded", async () => {
  const data = await fetchJSON("content/courses.json");
  const all = data?.courses || [];
  const re = new RegExp("Short|Online");
  const courses = all.filter(c => re.test(c.level));
  const sectionsEl = document.getElementById("course-sections");
  const searchEl = document.getElementById("course-search");

  if (!courses.length) {
    emptyState(sectionsEl, "Courses will appear here once added.");
    return;
  }

  const categories = [...new Set(courses.map(c => c.category))];

  function cardHTML(c) {
    return `
      <a href="course-${c.slug}.html" class="card course-card">
        <div class="card-body">
          <span class="card-tag">${esc(c.level)} · ${esc(c.duration)}</span>
          <h3 style="font-size:1.1rem;">${esc(c.name)}</h3>
        </div>
      </a>`;
  }

  function render(query) {
    const q = (query || "").toLowerCase().trim();
    let html = "";
    categories.forEach(cat => {
      const items = courses.filter(c => c.category === cat && (!q || c.name.toLowerCase().includes(q)));
      if (!items.length) return;
      html += `
        <div class="section-head" style="margin-top:36px;">
          <span class="eyebrow">${esc(cat)}</span>
          <h2>${esc(cat)}</h2>
        </div>
        <div class="grid grid-3">${items.map(cardHTML).join("")}</div>`;
    });
    sectionsEl.innerHTML = html || `<div class="empty-state">No courses match your search.</div>`;
  }

  searchEl.addEventListener("input", () => render(searchEl.value));
  render("");
});
</script>
</body>
</html>
